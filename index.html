<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Responsive -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- SEO Title -->
  <title>
    Florenza Jewellery | Elegant Handmade Jewellery Collection
  </title>

  <!-- SEO Description -->
  <meta
    name="description"
    content="Discover elegant handmade jewellery at Florenza. Explore premium bracelets, necklaces, earrings, and timeless collections crafted beautifully for every occasion."
  />

  <!-- Keywords -->
  <meta
    name="keywords"
    content="Florenza Jewellery, handmade jewellery, bracelets, earrings, necklaces, rings, fashion jewellery, premium jewellery India"
  />

  <!-- Author -->
  <meta
    name="author"
    content="Florenza Jewellery"
  />

  <!-- Theme Color -->
  <meta
    name="theme-color"
    content="#f8f1f1"
  />

  <!-- Open Graph / Social Sharing -->
  <meta
    property="og:title"
    content="Florenza Jewellery | Elegant Handmade Jewellery"
  />

  <meta
    property="og:description"
    content="Premium handmade jewellery crafted with elegance and timeless beauty."
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:url"
    content="https://florenza.shop"
  />

  <meta
    property="og:image"
    content="https://florenza.shop/preview.jpg"
  />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Florenza Jewellery"
  />

  <meta
    name="twitter:description"
    content="Elegant handmade jewellery crafted beautifully for every occasion."
  />

</head>

<body>
  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>

</html>
